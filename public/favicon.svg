<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer Ring / Dial -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="24" />

  <!-- Clock Progress Arc (representing hours worked) -->
  <path d="M 256 96 A 160 160 0 1 1 143 369" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" />

  <!-- Center Clock Face Inner Circle -->
  <circle cx="256" cy="256" r="120" fill="#ffffff" />

  <!-- Clock Hands -->
  <!-- Hour hand (pointing to 10 o'clock) -->
  <line x1="256" y1="256" x2="200" y2="180" stroke="#1e293b" stroke-width="20" stroke-linecap="round" />
  <!-- Minute hand (pointing to 2 o'clock) -->
  <line x1="256" y1="256" x2="310" y2="170" stroke="#2563eb" stroke-width="16" stroke-linecap="round" />
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="14" fill="#1e293b" />
  <circle cx="256" cy="256" r="6" fill="#38bdf8" />

  <!-- Small Badge / Calculator Checkbox in Corner -->
  <g transform="translate(320, 320)">
    <rect x="0" y="0" width="110" height="110" rx="30" fill="#10b981" />
    <path d="M 32 55 L 48 72 L 80 38" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
